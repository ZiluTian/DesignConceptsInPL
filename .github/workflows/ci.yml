name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run the test suites (Mill)
        run: |
          set -euo pipefail
          MILL_VERSION="$(cat .mill-version)"
          curl -fsSL "https://github.com/com-lihaoyi/mill/releases/download/${MILL_VERSION}/${MILL_VERSION}-assembly" -o mill
          chmod +x mill
          ./mill __.test
